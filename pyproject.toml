[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-chat-exporter"
version = "0.2.0"
description = "Export full WeChat 4.x chat history from your own local databases to CSV / Excel / HTML / PDF / Word."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wechat-chat-exporter contributors" }]
keywords = ["wechat", "chat", "export", "sqlcipher", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pycryptodome>=3.20",
    "zstandard>=0.22",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
pdf = ["fpdf2>=2.7", "Pillow>=10"]
docx = ["python-docx>=1.1"]
images = ["Pillow>=10"]
all = ["openpyxl>=3.1", "fpdf2>=2.7", "Pillow>=10", "python-docx>=1.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
wechat-chat-exporter = "wechat_chat_exporter.cli:main"
wce = "wechat_chat_exporter.cli:main"

[project.urls]
Homepage = "https://github.com/falling-fifteen/wechat-chat-exporter"
Repository = "https://github.com/falling-fifteen/wechat-chat-exporter"
Issues = "https://github.com/falling-fifteen/wechat-chat-exporter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: tests that require a real WeChat data directory (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
